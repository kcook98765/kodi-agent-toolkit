name: Bug report
description: Report a reproducible toolkit or documentation problem.
body:
  - type: markdown
    attributes:
      value: Use a minimal disposable fixture. Remove credentials, endpoints, personal paths, library metadata, and sensitive transcripts. Security defects belong in the private reporting channel.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python, toolkit commit/version, Kodi target; agent/model version only if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands and a minimal sanitized fixture or source example.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and observed behavior
      description: Include exits, failed stages and retained warnings. Distinguish static results from runtime observations and model claims.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public contents
      options:
        - label: I removed private credentials, configuration, Kodi data, and sensitive output.
          required: true
