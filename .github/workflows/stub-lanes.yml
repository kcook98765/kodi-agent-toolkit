name: Isolated static stub lanes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static:
    name: Static (${{ matrix.lane }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [matrix]
        os: [ubuntu-24.04, windows-2025]
        include:
          - os: ubuntu-24.04
            python: .local/lane/bin/python
          - os: windows-2025
            python: .local/lane/Scripts/python.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install separate hash-locked tools
        run: |
          python -m venv .local/lane
          ${{ matrix.python }} -m pip install --require-hashes --only-binary=:all: -r requirements-${{ matrix.lane }}.lock
          ${{ matrix.python }} -m pip install --no-build-isolation --no-deps -e .
          ${{ matrix.python }} -m pip check
      - name: Record actual interpreter and packages
        run: |
          mkdir -p .local/qualification
          ${{ matrix.python }} -VV > .local/qualification/python.txt
          ${{ matrix.python }} -m pip freeze --all > .local/qualification/packages.txt
          ${{ matrix.python }} -m kodi_agent_toolkit.cli stub-lanes > .local/qualification/stub-lanes.json
      - name: Real positive and negative static qualification
        run: |
          ${{ matrix.python }} tests/lanes/${{ matrix.lane }}.py -v > .local/qualification/tests.txt 2>&1 || { cat .local/qualification/tests.txt; exit 1; }
          cat .local/qualification/tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: static-${{ matrix.lane }}-${{ matrix.os }}
          path: .local/qualification/
          include-hidden-files: true
