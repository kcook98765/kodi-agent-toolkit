name: Standalone validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standalone:
    name: Standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: .venv/bin/python
          - os: windows-2025
            python: .venv/Scripts/python.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked development tools
        run: |
          python -m venv .venv
          ${{ matrix.python }} -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          ${{ matrix.python }} -m pip install --no-build-isolation --no-deps -e .
          ${{ matrix.python }} -m pip check
      - name: Offline regressions and historical invariants
        run: |
          ${{ matrix.python }} -m unittest discover -s tests -v
          ${{ matrix.python }} evaluation/scorecard.py
          ${{ matrix.python }} evaluation/run.py --help
      - name: Public-content scans
        run: |
          ${{ matrix.python }} scripts/secret-scan.py
          ${{ matrix.python }} scripts/secret-scan.py --staged
          ${{ matrix.python }} scripts/secret-scan.py --history
